<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Myriams Tagesplan</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --sage: #6B8F71;
    --sage-light: #A8C5AC;
    --sage-dark: #3D5C42;
    --cream: #FAF7F2;
    --warm: #F0EAE0;
    --gold: #C9A84C;
    --gold-light: #EDD98A;
    --text: #2C2C2C;
    --text-light: #6B6B6B;
    --red-soft: #E8726A;
    --blue-soft: #6A8DB5;
    --purple-soft: #9B7FC2;
    --orange-soft: #D4854A;
    --white: #FFFFFF;
    --shadow: 0 4px 24px rgba(0,0,0,0.08);
    --radius: 16px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--cream);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 40px;
  }

  /* HEADER */
  .header {
    background: linear-gradient(135deg, var(--sage-dark) 0%, var(--sage) 60%, var(--sage-light) 100%);
    padding: 32px 20px 28px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .header::before {
    content: '';
    position: absolute;
    top: -40px; right: -40px;
    width: 200px; height: 200px;
    background: rgba(255,255,255,0.06);
    border-radius: 50%;
  }
  .header::after {
    content: '';
    position: absolute;
    bottom: -60px; left: -30px;
    width: 160px; height: 160px;
    background: rgba(255,255,255,0.04);
    border-radius: 50%;
  }
  .header h1 {
    font-family: 'Playfair Display', serif;
    font-size: 26px;
    color: white;
    letter-spacing: 0.5px;
    position: relative;
  }
  .header .subtitle {
    color: rgba(255,255,255,0.75);
    font-size: 13px;
    margin-top: 4px;
    font-weight: 300;
    position: relative;
  }
  .date-badge {
    display: inline-block;
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.25);
    color: white;
    font-size: 12px;
    padding: 4px 14px;
    border-radius: 20px;
    margin-top: 10px;
    position: relative;
  }

  /* PROGRESS BAR */
  .progress-wrap {
    background: var(--warm);
    padding: 16px 20px;
    border-bottom: 1px solid rgba(0,0,0,0.06);
  }
  .progress-label {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--text-light);
    margin-bottom: 8px;
  }
  .progress-bar {
    height: 8px;
    background: rgba(0,0,0,0.08);
    border-radius: 10px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--sage), var(--gold));
    border-radius: 10px;
    transition: width 0.5s ease;
  }

  /* CONTENT */
  .content { padding: 16px 16px 0; max-width: 480px; margin: 0 auto; }

  /* BLOCK */
  .block {
    background: white;
    border-radius: var(--radius);
    margin-bottom: 14px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .block-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 16px 10px;
    border-bottom: 1px solid rgba(0,0,0,0.05);
  }
  .block-icon {
    width: 36px; height: 36px;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
  }
  .block-title {
    font-family: 'Playfair Display', serif;
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
  }
  .block-time {
    font-size: 11px;
    color: var(--text-light);
    font-weight: 300;
    margin-top: 1px;
  }

  /* ITEMS */
  .item {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 11px 16px;
    border-bottom: 1px solid rgba(0,0,0,0.04);
    cursor: pointer;
    transition: background 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  .item:last-child { border-bottom: none; }
  .item:active { background: rgba(0,0,0,0.02); }
  .item.done { opacity: 0.5; }
  .item.done .item-name { text-decoration: line-through; }

  .checkbox {
    width: 22px; height: 22px;
    border-radius: 6px;
    border: 2px solid #DDD;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    margin-top: 1px;
    transition: all 0.2s;
  }
  .item.done .checkbox {
    background: var(--sage);
    border-color: var(--sage);
  }
  .checkbox-check {
    color: white;
    font-size: 13px;
    display: none;
  }
  .item.done .checkbox-check { display: block; }

  .item-body { flex: 1; }
  .item-name { font-size: 14px; font-weight: 500; color: var(--text); }
  .item-detail { font-size: 12px; color: var(--text-light); margin-top: 2px; font-weight: 300; }

  .item-badge {
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 10px;
    font-weight: 500;
    flex-shrink: 0;
    margin-top: 3px;
  }

  /* MAHLZEIT BLOCK */
  .meal-block {
    background: white;
    border-radius: var(--radius);
    margin-bottom: 14px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .meal-header {
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .meal-content {
    padding: 0 16px 14px;
    font-size: 13px;
    color: var(--text-light);
    line-height: 1.6;
  }
  .meal-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 4px 0;
    font-size: 13px;
    color: var(--text);
  }
  .meal-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .meal-tip {
    background: var(--warm);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 11px;
    color: var(--text-light);
    margin-top: 8px;
    font-style: italic;
  }

  /* NOVALGIN */
  .novalgin-badge {
    background: linear-gradient(135deg, #E8726A, #C4534A);
    color: white;
  }
  .novalgin-warning {
    background: #FFF3F3;
    border-left: 3px solid var(--red-soft);
    margin: 0 16px 12px;
    padding: 8px 10px;
    border-radius: 0 8px 8px 0;
    font-size: 11px;
    color: #C4534A;
  }

  /* COLOR THEMES */
  .theme-morning .block-icon { background: #FFF8E8; }
  .theme-noon .block-icon { background: #F0F7FF; }
  .theme-afternoon .block-icon { background: #F5F0FF; }
  .theme-evening .block-icon { background: #F0FFF4; }
  .theme-night .block-icon { background: #F0F4FF; }

  /* RESET BUTTON */
  .reset-wrap {
    text-align: center;
    padding: 20px;
  }
  .reset-btn {
    background: none;
    border: 1px solid var(--sage-light);
    color: var(--sage-dark);
    padding: 10px 24px;
    border-radius: 20px;
    font-size: 13px;
    font-family: 'DM Sans', sans-serif;
    cursor: pointer;
    transition: all 0.2s;
  }
  .reset-btn:hover { background: var(--sage); color: white; border-color: var(--sage); }

  /* HINWEIS */
  .hinweis {
    background: var(--warm);
    border-radius: var(--radius);
    padding: 14px 16px;
    margin-bottom: 14px;
    font-size: 12px;
    color: var(--text-light);
    text-align: center;
    line-height: 1.5;
  }
  .hinweis strong { color: var(--sage-dark); }
</style>
</head>
<body>

<div class="header">
  <h1>🌿 Myriams Tagesplan</h1>
  <div class="subtitle">Supplements · Ernährung · Schmerzmanagement</div>
  <div class="date-badge" id="dateDisplay">Laden...</div>
</div>

<div class="progress-wrap">
  <div class="progress-label">
    <span>Tagesfortschritt</span>
    <span id="progressText">0 / 0 erledigt</span>
  </div>
  <div class="progress-bar">
    <div class="progress-fill" id="progressFill" style="width:0%"></div>
  </div>
</div>

<div class="content" id="app"></div>

<script>
const STORAGE_KEY = 'myriam_plan_' + new Date().toDateString();

const plan = [
  {
    id: 'morgen',
    theme: 'morning',
    icon: '🌅',
    title: 'Morgens – Nüchtern',
    time: 'vor dem Frühstück',
    items: [
      { id: 'm1', name: 'L-Glutamin', detail: '5g Pulver in einem Glas Wasser – nüchtern, vor dem Shake', badge: null },
    ]
  },
  {
    id: 'fruehstueck',
    theme: 'morning',
    icon: '☕',
    title: 'Frühstück / Shake',
    time: 'ca. 8–9 Uhr',
    items: [
      { id: 'f1', name: 'Protein-Shake', detail: 'More Iced Coffee mit ungesüßter Mandelmilch', badge: null },
      { id: 'f2', name: 'Chia-Samen + Flohsamen', detail: 'Je 1 TL in den Shake – verlangsamt Blutzuckeranstieg', badge: null },
      { id: 'f3', name: 'D3/K2 5.000 IE', detail: '1 Tablette zum Shake – fettlöslich, mit Mandelmilch optimal', badge: null },
    ],
    meal: {
      title: 'Shake-Tipp',
      color: '#C9A84C',
      items: ['Mandelmilch (ungesüßt) + Shake-Pulver', 'Chia + Flohsamen einrühren', '5 Min quellen lassen vor dem Trinken'],
      tip: 'Kein Hunger morgens? Kein Problem – Shake ist ausreichend.'
    }
  },
  {
    id: 'novalgin1',
    theme: 'morning',
    icon: '💊',
    title: 'Novalgin – 1. Einnahme',
    time: 'ca. 9–10 Uhr (zum / nach dem Frühstück)',
    novalgin: true,
    items: [
      { id: 'n1', name: 'Novalgin 500mg × 2', detail: 'Immer zum Essen oder danach – niemals nüchtern', badge: 'novalgin' },
    ]
  },
  {
    id: 'mittag',
    theme: 'noon',
    icon: '🥗',
    title: 'Mittagessen',
    time: 'ca. 12–13 Uhr',
    items: [
      { id: 'mi1', name: 'Omega-3 Fischöl', detail: '2–3 Kapseln zum Essen – Entzündung senken, Knöchel', badge: null },
      { id: 'mi2', name: 'Zink', detail: '1 Kapsel zum Essen – Immunsystem, Wundheilung', badge: null },
    ],
    meal: {
      title: 'Mittagsoptionen',
      color: '#6A8DB5',
      items: [
        'Hähnchenbrust + viel Salat + Olivenöl',
        'Lachs + gedünstetes Gemüse',
        'Hülsenfrüchte (Linsen/Kichererbsen) + Gemüse',
        'Eierpfanne + Champignons + Paprika',
      ],
      tip: 'Kein Dinkeltoast mehr – ersetzen durch mehr Protein oder Avocado.'
    }
  },
  {
    id: 'novalgin2',
    theme: 'afternoon',
    icon: '💊',
    title: 'Novalgin – 2. Einnahme',
    time: 'ca. 15–16 Uhr (mind. 6h nach Einnahme 1)',
    novalgin: true,
    items: [
      { id: 'n2', name: 'Novalgin 500mg × 2', detail: 'Mit einem Glas Wasser und kleinem Snack', badge: 'novalgin' },
    ]
  },
  {
    id: 'snack',
    theme: 'afternoon',
    icon: '🫐',
    title: 'Nachmittags-Snack (optional)',
    time: 'ca. 15–16 Uhr',
    items: [],
    meal: {
      title: 'Snack-Ideen',
      color: '#9B7FC2',
      items: [
        'Handvoll Nüsse (Walnüsse, Mandeln)',
        'Joghurt (ungezuckert) + Beeren',
        'Avocado mit Zitrone + Salz',
        'Gekochtes Ei',
      ],
      tip: 'Keine Süßigkeiten, kein Obst mit hohem Zuckergehalt (Banane, Weintrauben).'
    }
  },
  {
    id: 'abend',
    theme: 'evening',
    icon: '🍽️',
    title: 'Abendessen (Hauptmahlzeit)',
    time: 'ca. 18–19 Uhr',
    items: [],
    meal: {
      title: 'Abendessen-Prinzip',
      color: '#6B8F71',
      items: [
        'Viel Protein: Fleisch, Fisch, Eier',
        'Viel Gemüse: gedünstet oder roh',
        'Wenig Kohlenhydrate: kein Brot, wenig Reis/Kartoffeln',
        'Gutes Fett: Olivenöl, Avocado, Feta',
      ],
      tip: 'Kochbox-Gerichte: Beilage halbieren, Protein + Gemüse verdoppeln.'
    }
  },
  {
    id: 'novalgin3',
    theme: 'evening',
    icon: '💊',
    title: 'Novalgin – 3. Einnahme',
    time: 'ca. 21–22 Uhr (mind. 6h nach Einnahme 2)',
    novalgin: true,
    items: [
      { id: 'n3', name: 'Novalgin 500mg × 2', detail: 'Zum Abendessen oder danach – nicht zu kurz vor dem Schlafen', badge: 'novalgin' },
    ]
  },
  {
    id: 'nacht',
    theme: 'night',
    icon: '🌙',
    title: 'Abends / Vor dem Schlafen',
    time: 'ca. 21–22 Uhr',
    items: [
      { id: 'ab1', name: 'Magnesium Komplex', detail: '2 Kapseln – Schlaf, Muskelentspannung, D3-Aktivierung', badge: null },
      { id: 'ab2', name: 'Ashwagandha', detail: '1 Kapsel – Cortisol senken, Nachtschweiß reduzieren', badge: null },
      { id: 'ab3', name: 'Probiotikum', detail: '1 Kapsel – Mikrobiom aufbauen, Darmheilung', badge: null },
    ]
  }
];

// Load state
let state = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');

// Auto-reset at midnight
const lastDate = localStorage.getItem('myriam_last_date');
const today = new Date().toDateString();
if (lastDate !== today) {
  state = {};
  localStorage.setItem('myriam_last_date', today);
  localStorage.setItem(STORAGE_KEY, '{}');
}

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function getAllItems() {
  return plan.flatMap(b => b.items);
}

function updateProgress() {
  const all = getAllItems();
  const done = all.filter(i => state[i.id]).length;
  const pct = all.length > 0 ? Math.round((done / all.length) * 100) : 0;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = done + ' / ' + all.length + ' erledigt';
}

function toggleItem(id) {
  state[id] = !state[id];
  saveState();
  const el = document.querySelector('[data-id="' + id + '"]');
  if (el) {
    el.classList.toggle('done', state[id]);
  }
  updateProgress();
}

function renderBadge(type) {
  if (type === 'novalgin') {
    return '<span class="item-badge novalgin-badge">Schmerzmittel</span>';
  }
  return '';
}

function renderBlock(block) {
  const itemsHtml = block.items.map(item => `
    <div class="item ${state[item.id] ? 'done' : ''}" data-id="${item.id}" onclick="toggleItem('${item.id}')">
      <div class="checkbox">
        <span class="checkbox-check">✓</span>
      </div>
      <div class="item-body">
        <div class="item-name">${item.name}</div>
        <div class="item-detail">${item.detail}</div>
      </div>
      ${renderBadge(item.badge)}
    </div>
  `).join('');

  const mealHtml = block.meal ? `
    <div style="padding: 0 16px 14px;">
      <div style="background: ${block.meal.color}15; border-radius: 10px; padding: 12px; border-left: 3px solid ${block.meal.color};">
        <div style="font-size: 11px; font-weight: 600; color: ${block.meal.color}; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px;">${block.meal.title}</div>
        ${block.meal.items.map(i => `
          <div class="meal-item">
            <div class="meal-dot" style="background: ${block.meal.color};"></div>
            <span style="font-size: 13px;">${i}</span>
          </div>
        `).join('')}
        <div class="meal-tip">${block.meal.tip}</div>
      </div>
    </div>
  ` : '';

  const novalginWarning = block.novalgin ? `
    <div class="novalgin-warning">
      ⚠️ Immer zum Essen · Mindestens 6h Abstand zur nächsten Einnahme · Kein Alkohol
    </div>
  ` : '';

  return `
    <div class="block theme-${block.theme}">
      <div class="block-header">
        <div class="block-icon">${block.icon}</div>
        <div>
          <div class="block-title">${block.title}</div>
          <div class="block-time">${block.time}</div>
        </div>
      </div>
      ${novalginWarning}
      ${itemsHtml}
      ${mealHtml}
    </div>
  `;
}

function render() {
  const date = new Date();
  const options = { weekday: 'long', day: 'numeric', month: 'long' };
  document.getElementById('dateDisplay').textContent = date.toLocaleDateString('de-DE', options);

  const html = `
    <div class="hinweis">
      <strong>Tipp:</strong> Tippe auf eine Aufgabe um sie abzuhaken.<br>Der Plan setzt sich täglich automatisch zurück.
    </div>
    ${plan.map(renderBlock).join('')}
    <div class="reset-wrap">
      <button class="reset-btn" onclick="resetDay()">🔄 Tag zurücksetzen</button>
    </div>
  `;

  document.getElementById('app').innerHTML = html;
  updateProgress();
}

function resetDay() {
  state = {};
  saveState();
  render();
}

render();
</script>
</body>
</html>
